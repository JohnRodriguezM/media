// ---------- scenes ----------
function box(cls,style,inner){return `<div class="box ${cls}" style="${style}">${inner}</div>`;}
const SC={
 title(s,t){BG.noche(t);const bob=Math.round(Math.sin(t*4));spr(s.actor||'andres',66,150+bob,{scale:3});

  (s.actors||[]).forEach(a=>{const u=(t-(a.t0||0))/((a.t1||1)-(a.t0||0));const x=lerp(a.from[0],a.to[0],u),y=lerp(a.from[1],a.to[1],u);
    const moving=u>0&&u<1;const bob=moving&&Math.floor(t*8)%2?-2:0;
    if(a.cart){const cx=a.flip?x-28:x+26,cy=y-22;R(cx-4,cy-4,6,2,'k');R(cx,cy,28,2,'k');R(cx+2,cy+2,24,12,'g');for(let i=0;i<24;i+=5)R(cx+2+i,cy+2,1,12,'G');R(cx+2,cy+14,24,2,'k');CI(cx+5,cy+19,2,'k');CI(cx+22,cy+19,2,'k');}
    spr(a.id,x,y-48+bob,{walk:moving&&Math.floor(t*8)%2,flip:a.flip,noShadow:a.seated});
    if(a.sweat&&moving&&Math.floor(t*4)%2){R(x+27,y-44,2,3,'C');R(x+3,y-40,2,3,'C');}});
  if(s.bg==='sala'&&s.sofa)BG.sofa();
  if(s.phone){const [px,py]=s.phone;GLOW(px+3,py-10,22,'#73eff7',.35);R(px,py,7,11,'k');R(px+1,py+1,5,9,Math.floor(t*3)%2?'C':'c');}
  (s.bubbles||[]).forEach(b=>{if(t<b.at)return;const a=(s.actors||[]).find(x=>x.id===b.actor);if(!a)return;const x=a.to[0]+8,y=a.to[1]-78;
    R(x,y,20,20,'k');R(x+2,y+2,16,16,'w');R(x+6,y+20,4,4,'k');R(x+7,y+20,2,2,'w');c.fillStyle=P.k;c.font='16px Sk';c.fillText(b.text,x+5,y+16);});
  if(s.hud){const u=lerp(s.hud.from,s.hud.to,t/(s.dur*.85));R(10,100,160,14,'k');R(12,102,Math.round(156*u),10,u>.5?'l':u>.3?'y':'r');R(12,102,Math.round(156*u),2,'w');
    h+=`<div style="position:absolute;top:540px;left:70px;font:700 34px Sk;color:#1a1c2c">${esc(s.hud.label)}</div>`;}
  (s.captions||[]).forEach(cp=>{if(t<cp.at)return;h+=box(cp.cls||'',`left:60px;right:90px;top:${cp.top||230}px`,tw(cp.text,t-cp.at));});
  return h;},
 chat(s,t){BG.noche(t);let msgs='';
  (s.msgs||[]).forEach(m=>{if(t>=m.at)msgs+=`<div class="bub ${m.from==='me'?'me':'th'}">${esc(m.text)}${m.time?`<span class="tm">${esc(m.time)}</span>`:''}</div>`;});
  let input='Escribe un mensaje';let typingNow=false;
  (s.drafts||[]).forEach(d=>{if(t>=d.at&&t<d.at+d.dur){const k=(t-d.at)/d.dur;const n=k<.6?Math.floor(d.text.length*k/.6):Math.floor(d.text.length*(1-(k-.6)/.4));input=esc(d.text.slice(0,Math.max(0,n)))+'<span class="cur"></span>';typingNow=true;}});
  if(s.typingThem&&t>=s.typingThem[0]&&t<s.typingThem[1])msgs+=`<div class="typing">${'.'.repeat(1+Math.floor(t*4)%3)}</div>`;
  let h=`<div class="phone"><div class="ph-h"><canvas class="ph-av" id="av" width="16" height="16"></canvas><div><div class="ph-n">${esc(s.name)}</div><div class="ph-s">${typingNow?'escribiendo…':(s.status||'en línea')}</div></div></div>

  (s.captions||[]).forEach(cp=>{if(t>=cp.at)h+=box(cp.cls||'y',`left:60px;right:90px;top:${cp.top||1180}px`,tw(cp.text,t-cp.at));});

 quest(s,t){BG.noche(t);spr(s.actor||'andres',74,214+(Math.floor(t*3)%2),{});const k=Math.min(1,t/.4);
  return box('y',`left:70px;right:100px;top:${470-40*(1-k)}px;text-align:center;opacity:${k}`,`<div class="lbl y-t">★ ${esc(s.label)} ★</div><div style="font:700 66px/1.15 Px">${tw(s.text,t-s.textAt)}</div>${s.sub&&t>s.subAt?`<div class="lbl g-t" style="margin-top:22px">${esc(s.sub)}</div>`:''}`);},
 tip(s,t){BG.consultorio(t);spr(s.speaker||'doctora',34,146,{scale:3,noShadow:true});R(0,212,W,40,'m');R(0,212,W,3,'B');D(0,222,W,30,'m','M');R(0,252,W,4,'k');
  R(116,170,48,38,'k');R(119,173,42,30,'K');c.strokeStyle=P.l;c.lineWidth=1;c.beginPath();for(let x=0;x<42;x++){const p=((x+t*30)%21)/21;let y=0;if(p>.4&&p<.45)y=-9;else if(p>.45&&p<.5)y=5;x?c.lineTo(119+x,190+y):c.moveTo(119,190);}c.stroke();R(136,208,8,4,'G');
  let h=box('c','left:60px;right:90px;top:230px',`<div class="lbl c-t">${esc(s.name)}</div>${tw(s.text,t-s.textAt)}`);

 choice(s,t){BG.camino(t);spr(s.actor||'andres',74,248,{});

  if(t>s.aAt)h+=`<div class="opt" style="top:560px"><div class="k" style="background:#ffcd75">A</div><div>${esc(s.a)}</div></div>`;
  if(t>s.bAt)h+=`<div class="opt" style="top:800px"><div class="k" style="background:#73eff7">B</div><div>${esc(s.b)}</div></div>`;
  if(t>s.ctaAt)h+=`<div class="box l" style="left:120px;right:150px;top:1030px;text-align:center"><div style="font:700 70px Sk;color:#a7f070;visibility:${Math.floor(t*2.5)%2===0?'visible':'hidden'}">${esc(s.cta)}</div><div style="font:500 38px Px;margin-top:10px">${esc(s.small||'')}</div></div>`;return h;}

let EP=null,STARTS=[];
window.load=ep=>{EP=JSON.parse(JSON.stringify(ep));const total=plan(EP);let a=0;STARTS=EP.scenes.map(s=>{const r=a;a+=s.dur;return r;});return total;};
window.renderAt=T=>{let i=STARTS.findLastIndex(x=>x<=T);if(i<0)i=0;const s=EP.scenes[i],t=T-STARTS[i];
  c.clearRect(0,0,W,H);let h=SC[s.type](s,t);
  if(t<.3&&i>0){const u=t/.3;SEED=i*13;for(let y=0;y<H;y+=20)for(let x=0;x<W;x+=20)if(rnd()>u)R(x,y,20,20,'k');}
  h+=`<div class="hud"><span>${esc(EP.hudLeft||'')}</span><span class="y-t">${esc(s.hudDay||EP.hudRight||'')}</span></div><div class="foot">@ladosisdeciencia</div>`;
  document.getElementById('ui').innerHTML=h;
  const av=document.getElementById('av');if(av&&s.avatar){const x=av.getContext('2d');SP[s.avatar].slice(1,17).forEach((r,j)=>{for(let k=0;k<16;k++){const ch=r[k];if(ch&&ch!=='.'){x.fillStyle=P[ch];x.fillRect(k,j,1,1);}}});}
};
window.SCENE_TIMES=()=>EP.scenes.map((s,i)=>({type:s.type,bg:s.bg,start:STARTS[i],dur:s.dur}));
