<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Motor "indie" (estilo v2, aprobado por John el 2026-11-12) para los episodios de La Dosis de Ciencia.
  Pixel art detallado: mundo 360x640 (x3 = 1080x1920), personajes procedurales con expresiones,
  luz por capas, cámara con cortes (close / mid / two / wide), diálogos tipo RPG con "voz" de bips.
  load(ep) -> segundos totales (window.EVENTS para el audio); renderAt(t) dibuja un fotograma.
  Los tiempos son automáticos según la longitud de los textos. Spec: ver tools/carrusel/GUIA.md.
-->
<style>

      padding:26px 34px;font:500 52px/1.28 Px;color:#f4ecd8}

       box-shadow:0 0 0 6px #140f1c,14px 14px 0 6px rgba(0,0,0,.45);font:500 50px/1.22 Px;color:#f4ecd8}

<body><canvas id="c" class="full" width="360" height="640"></canvas><div id="ui"></div>
<script>
const W=360,H=640;
const cv=document.getElementById('c'),C=cv.getContext('2d');C.imageSmoothingEnabled=false;
const world=document.createElement('canvas');world.width=W;world.height=H;const X=world.getContext('2d');X.imageSmoothingEnabled=false;
let g=X; // current drawing context
const r=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const lerp=(a,b,u)=>a+(b-a)*Math.max(0,Math.min(1,u));
const ease=u=>{u=Math.max(0,Math.min(1,u));return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
let SEED=1;const rnd=()=>{SEED=(SEED*16807)%2147483647;return SEED/2147483647;};
function ell(cx,cy,rx,ry,col){g.fillStyle=col;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry)));g.fillRect(Math.round(cx-w),Math.round(cy+y),2*w+1,1);}}
function dith(x,y,w,h,col,step=2){g.fillStyle=col;for(let j=0;j<h;j++)for(let i=(j%2);i<w;i+=step)g.fillRect(x+i,y+j,1,1);}

// ---------- palette per character ----------
const OUT='#2a1e2e';
const PEOPLE={
 andres:{skin:['#f2c29b','#dc9f78','#b8785a','#8c5440'],hair:['#4a3630','#2c1f1c','#80736e'],shirt:['#6f9be0','#4f7fd0','#3a5fae','#2b4585'],
   pants:['#4a4c66','#363850','#26283a'],shoe:'#5a3a2a',stubble:true,bags:true,style:'short'},
 doctora:{skin:['#e8b58c','#c98a63','#a06648','#6e4030'],hair:['#6e4232','#4a2c22','#2e1a16'],shirt:['#ffffff','#eef0f2','#cdd4dc','#9aa4b2'],
   pants:['#3fa39a','#2e7d78','#1f5a57'],shoe:'#2a2a38',glasses:true,style:'bun',scrubs:['#3fa39a','#2e7d78']}
};
// head mask: half-widths for 28 rows (24 wide, centre between 11 and 12)
const HW=[5,7,8,9,10,10,11,11,11,11,11,11,11,11,11,11,11,11,11,10,10,9,9,8,7,6,5,3];
function headPix(ox,oy,s){return (x,y,col)=>{g.fillStyle=col;g.fillRect(Math.round(ox+x*s),Math.round(oy+y*s),s,s);};}
function head(ox,oy,s,who,o={}){
 const P=PEOPLE[who],sk=P.skin,p=headPix(ox,oy,s),ex=o.expr||'neutral';
 // back hair
 if(P.style==='bun'){for(let y=3;y<24;y++){const hw=Math.min(13,HW[Math.min(27,y)]+2);for(let x=12-hw;x<12+hw;x++)p(x,y,y>16?P.hair[2]:P.hair[1]);}
   for(let y=-6;y<2;y++)for(let x=14;x<22;x++){const dx=x-18,dy=y+2;if(dx*dx+dy*dy<=15)p(x,y,dx+dy<-1?P.hair[0]:P.hair[1]);}}
 // ears
 for(let y=13;y<18;y++){p(-1,y,sk[2]);p(24,y,sk[2]);}p(-1,15,sk[3]);p(24,15,sk[3]);
 // face
 for(let y=0;y<28;y++){const hw=HW[y];for(let x=12-hw;x<12+hw;x++){let col=sk[1];
   if(x>=12+hw-3)col=sk[2];if(x===12-hw||(y<4))col=x===12-hw?sk[2]:col;if(x===12-hw+1&&y>6&&y<20)col=sk[0];if(y>=24)col=sk[2];
   p(x,y,col);}
   p(12-hw-1,y,OUT);p(12+hw,y,OUT);}
 for(let x=12-HW[0];x<12+HW[0];x++)p(x,-1,OUT);for(let x=12-HW[27];x<12+HW[27];x++)p(x,28,OUT);
 // chin/jaw shadow + stubble
 for(let x=8;x<16;x++)p(x,26,sk[2]);
 if(P.stubble){SEED=91;for(let y=22;y<27;y++)for(let x=12-HW[y]+1;x<12+HW[y]-1;x++){if((x+y)%2===0&&(y>23||x<9||x>14))p(x,y,'#cc9270');}}
 // cheek highlight
 p(5,16,sk[0]);p(6,16,sk[0]);
 // nose
 p(12,15,sk[2]);p(12,16,sk[2]);p(13,17,sk[3]);p(11,18,sk[2]);p(12,18,sk[3]);p(11,15,sk[0]);
 // eyes
 const look=o.look||0,blink=o.blink;
 const eye=(x0)=>{if(blink){for(let x=x0;x<x0+4;x++)p(x,14,OUT);return;}
   const big=ex==='surprised';for(let x=x0;x<x0+4;x++){p(x,13,'#f4f0ea');p(x,14,'#f4f0ea');if(big)p(x,12,'#f4f0ea');}
   const ix=x0+1+look;p(ix,13,'#3a2a20');p(ix+1,13,'#3a2a20');p(ix,14,'#3a2a20');p(ix+1,14,'#1a1214');if(big){p(ix,12,'#3a2a20');p(ix+1,12,'#3a2a20');}
   p(ix,13,'#fff');
   for(let x=x0;x<x0+4;x++)p(x,big?11:12,OUT);};
 if(ex==='happy'&&!o.talk){[[5,14],[6,13],[7,13],[8,14],[15,14],[16,13],[17,13],[18,14]].forEach(([x,y])=>p(x,y,OUT));}
 else{eye(5);eye(15);}
 if(P.bags&&ex!=='happy'){p(5,16,sk[2]);p(6,16,sk[2]);p(7,16,sk[2]);p(16,16,sk[2]);p(17,16,sk[2]);p(18,16,sk[2]);}
 // brows
 const B=P.hair[1];
 const brows={neutral:[[5,11],[6,11],[7,11],[8,11],[15,11],[16,11],[17,11],[18,11]],
  worried:[[4,11],[5,11],[6,10],[7,10],[8,9],[15,9],[16,10],[17,10],[18,11],[19,11]],
  surprised:[[5,9],[6,8],[7,8],[8,9],[15,9],[16,8],[17,8],[18,9]],
  happy:[[5,11],[6,10],[7,10],[8,11],[15,11],[16,10],[17,10],[18,11]],
  firm:[[5,10],[6,10],[7,11],[8,11],[15,11],[16,11],[17,10],[18,10]]};
 (brows[ex]||brows.neutral).forEach(([x,y])=>p(x,y,B));
 // mouth
 const M='#7a3030',T='#d86a6a';
 if(o.talk){const op=o.talk;if(op===2){for(let x=9;x<15;x++){p(x,21,OUT);p(x,22,M);}for(let x=10;x<14;x++)p(x,23,M);p(11,23,T);p(12,23,T);}
   else{for(let x=9;x<15;x++)p(x,21,OUT);for(let x=10;x<14;x++)p(x,22,M);}}
 else if(ex==='happy'){p(8,20,OUT);p(15,20,OUT);for(let x=9;x<15;x++)p(x,21,OUT);for(let x=10;x<14;x++)p(x,22,'#f4f0ea');}
 else if(ex==='surprised'){p(11,21,OUT);p(12,21,OUT);p(10,22,OUT);p(13,22,OUT);p(11,22,M);p(12,22,M);p(11,23,OUT);p(12,23,OUT);}
 else if(ex==='worried'){for(let x=10;x<14;x++)p(x,21,OUT);p(9,22,OUT);p(14,22,OUT);}
 else{for(let x=9;x<15;x++)p(x,21,OUT);p(10,22,sk[2]);p(11,22,sk[2]);p(12,22,sk[2]);}
 if(ex==='happy'){p(4,18,'#e88a8a');p(5,18,'#e88a8a');p(18,18,'#e88a8a');p(19,18,'#e88a8a');}
 // glasses
 if(P.glasses){const F='#3a2436';for(const x0 of [4,14]){for(let x=x0;x<x0+6;x++){p(x,12,F);p(x,16,F);}for(let y=12;y<17;y++){p(x0,y,F);p(x0+5,y,F);}}
   p(10,13,F);p(11,13,F);p(12,13,F);p(13,13,F);p(-1,13,F);p(24,13,F);if(!o.blink)p(8,13,'#cfefff');}
 // front hair
 const h=P.hair;
 if(P.style==='short'){
   for(let y=-2;y<7;y++){const hw=y===-2?7:y===-1?9:HW[y]+1;for(let x=12-hw;x<12+hw;x++){let col=h[1];if(y<1&&x<10)col=h[0];if(x>12+hw-4)col='#22181a';p(x,y,col);}}
   for(let y=7;y<14;y++){p(0,y,h[1]);p(-1,y,OUT);p(23,y,h[1]);p(24,y,OUT);if(y>9){p(0,y,h[2]);p(23,y,h[2]);}}
   p(1,7,h[1]);p(22,7,h[1]);p(1,8,h[1]);p(22,8,h[1]);
   for(let x=6;x<18;x++)if(x%3)p(x,7,h[1]);p(4,6,h[0]);p(5,5,h[0]);p(7,4,h[0]);
   for(let x=5;x<19;x++)p(x,-3,OUT);p(4,-2,OUT);p(19,-2,OUT);p(2,-1,OUT);p(3,-1,OUT);p(20,-1,OUT);p(21,-1,OUT);
 } else {
   for(let y=-2;y<9;y++){const hw=HW[Math.max(0,y)]+1;for(let x=12-hw;x<12+hw;x++){if(y>5&&x>7&&x<20)continue;let col=h[1];if(x<9&&y<4)col=h[0];if(x>12+hw-3)col=h[2];p(x,y,col);}}
   for(let x=8;x<20;x++)if(x<16)p(x,6,h[1]);p(6,7,h[1]);p(7,7,h[1]);p(5,8,h[1]);
   for(let y=8;y<20;y++){p(-1,y,h[1]);p(0,y,h[1]);p(23,y,h[1]);p(24,y,h[2]);}
 }
 // sweat
 if(o.sweat){const k=o.sweat;p(22,8+k,'#9fe3ff');p(22,9+k,'#9fe3ff');p(21,10+k,'#9fe3ff');p(22,10+k,'#5fb8e8');}
}
// seated body (front 3/4), origin = head origin, s=1
function body(ox,oy,who,o={}){
 const P=PEOPLE[who],sh=P.shirt,sk=P.skin,y0=oy+28;
 // neck
 r(ox+8,y0,8,4,sk[2]);r(ox+8,y0,8,1,sk[3]);
 // torso trapezoid
 for(let j=0;j<36;j++){const hw=j<3?13+j*2:19-(j>28?1:0);const L=ox+12-hw,Wd=2*hw;
   r(L-1,y0+3+j,Wd+2,1,OUT);r(L,y0+3+j,Wd,1,sh[1]);r(L,y0+3+j,3,1,sh[0]);r(L+Wd-6,y0+3+j,6,1,sh[2]);}
 if(who==='doctora'){ // coat + scrubs V + stethoscope
   for(let j=0;j<34;j++){const w=Math.max(0,8-j);r(ox+12-w,y0+3+j,2*w,1,P.scrubs[0]);}
   r(ox+11,y0+4,2,34,sh[2]);
   g.fillStyle='#3a3a48';for(let j=0;j<16;j++){g.fillRect(ox+4+Math.round(j*.2),y0+4+j,1,1);g.fillRect(ox+19-Math.round(j*.2),y0+4+j,1,1);}
   r(ox+7,y0+20,10,1,'#3a3a48');ell(ox+12,y0+23,2,2,'#b8c0cc');r(ox+11,y0+22,1,1,'#fff');
   r(ox+20,y0+12,6,6,sh[2]);r(ox+21,y0+11,1,4,'#41a6f6');r(ox+23,y0+11,1,4,'#e04848'); // pocket + pens
 }else{ // polo collar + buttons
   r(ox+6,y0+2,5,3,sh[0]);r(ox+13,y0+2,5,3,sh[0]);r(ox+11,y0+3,2,9,sh[2]);r(ox+11,y0+6,1,1,'#e8eef8');r(ox+11,y0+9,1,1,'#e8eef8');
   r(ox+2,y0+30,20,2,sh[2]); // belly fold
 }
 // arms (resting forward)
 const arm=(x,flip)=>{for(let j=0;j<26;j++){r(x,y0+5+j,6,1,j<14?sh[flip?2:1]:sh[flip?3:2]);r(x+(flip?5:0),y0+5+j,1,1,OUT);}
   const hx=x+(flip?-4:2),hy=y0+29;r(hx,hy,8,5,sk[1]);r(hx,hy+4,8,1,sk[2]);r(hx-1,hy,1,5,OUT);r(hx+8,hy,1,5,OUT);r(hx,hy+5,8,1,OUT);};
 arm(ox-8,false);arm(ox+26,true);
 if(o.legs!==false){const yL=y0+39; // thighs foreshortened + shins + shoes
   r(ox-6,yL,36,9,P.pants[0]);r(ox-6,yL,36,2,P.pants[0]);r(ox+20,yL,10,9,P.pants[1]);r(ox+11,yL+2,2,7,P.pants[2]);
   for(const lx of [ox-3,ox+15]){r(lx,yL+9,10,30,P.pants[1]);r(lx,yL+9,2,30,P.pants[0]);r(lx+8,yL+9,2,30,P.pants[2]);r(lx-1,yL+9,1,30,OUT);r(lx+10,yL+9,1,30,OUT);
     r(lx-2,yL+38,14,5,P.shoe);r(lx-2,yL+38,14,1,'#7a5440');r(lx-2,yL+43,14,1,OUT);}}
}

// ---------- consultorio ----------
function room(t){
 // wall
 r(0,0,W,330,'#cfe0dc');for(let x=0;x<W;x+=40){r(x,0,1,250,'#bcd2ce');}
 const grd=X.createLinearGradient(0,0,0,250);grd.addColorStop(0,'rgba(60,80,90,.18)');grd.addColorStop(1,'rgba(60,80,90,0)');X.fillStyle=grd;X.fillRect(0,0,W,250);
 r(0,250,W,80,'#a9c4c0');r(0,248,W,3,'#eef5f3');r(0,251,W,1,'#8eaeaa');for(let x=20;x<W;x+=60){r(x,262,40,56,'#9dbab6');r(x,262,40,1,'#c2d8d4');}
 r(0,326,W,4,'#6e8a88');
 // window right
 r(270,50,84,150,'#f4f4f0');r(274,54,76,142,'#8fd0f0');
 const sky=X.createLinearGradient(0,54,0,196);sky.addColorStop(0,'#7cc4ee');sky.addColorStop(1,'#d8f0f8');X.fillStyle=sky;X.fillRect(274,54,76,142);
 SEED=4;for(let x=274;x<350;){const w=6+(rnd()*10|0),h=20+(rnd()*50|0);r(x,196-h,w,h,'#a9c8d8');for(let yy=196-h+3;yy<194;yy+=5)for(let xx=x+1;xx<x+w-1;xx+=3)if(rnd()<.4)r(xx,yy,1,2,'#e8f6fc');x+=w+1;}
 ell(340,90,22,18,'#5aa05a');ell(330,80,14,10,'#7cc070');ell(352,110,14,12,'#4a8a4a');r(347,104,3,40,'#6a4a30');
 for(let y=58;y<120;y+=6){r(274,y,76,3,'#f0ebe0');r(274,y+3,76,1,'#c8c0b0');}
 r(310,54,2,142,'#f4f4f0');r(266,198,92,6,'#e6e2d8');r(266,204,92,2,'#b0aa9c');
 r(278,120,2,40,'#a8a090');// blind cord
