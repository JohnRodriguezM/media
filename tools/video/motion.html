<!doctype html>
<html><head><meta charset="utf-8">
<!-- Motion-graphics + 3D engine for La Dosis de Ciencia narrated videos.
     load(data) where data = {beats:[{start,end,vis,words:[{w,s,e}],...}], total}; renderAt(t). -->
<style>
  @font-face{font-family:Fr;src:url(../carrusel/fonts/Fraunces.ttf);font-weight:100 900}
  @font-face{font-family:In;src:url(file:///usr/share/fonts/opentype/inter/Inter-Black.otf);font-weight:900}
  @font-face{font-family:In;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf);font-weight:800}
  @font-face{font-family:In;src:url(file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf);font-weight:600}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b1022}
  #bg{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 40%,#22184d 0%,#0f1530 55%,#080b18 100%)}
  #grid{position:absolute;inset:0;opacity:.10;background-image:linear-gradient(#73eff7 1px,transparent 1px),linear-gradient(90deg,#73eff7 1px,transparent 1px);background-size:90px 90px;
        -webkit-mask-image:radial-gradient(ellipse 70% 50% at 50% 45%,#000 30%,transparent 80%)}
  #gl{position:absolute;inset:0;width:1080px;height:1920px}
  #ui{position:absolute;inset:0}
  .handle{position:absolute;top:120px;left:0;right:0;text-align:center;font:800 30px In;letter-spacing:6px;color:#ffc46b;opacity:.9}
  .cap{position:absolute;left:70px;right:110px;top:1180px;text-align:center;font:900 92px/1.08 In;color:#fff;letter-spacing:-1px;
       -webkit-text-stroke:14px #0b1022;paint-order:stroke fill;text-transform:uppercase}
  .cap span{display:inline-block;margin:0 18px;transition:none}
  .cap .on{color:#ffd166;transform:scale(1.08)}
  .num{font-family:Fr;font-weight:700}
  .big{position:absolute;left:0;right:0;text-align:center;font:800 300px/0.9 Fr;color:#fff;letter-spacing:-8px;
       text-shadow:0 0 60px rgba(255,122,89,.55)}
  .lab{position:absolute;left:0;right:0;text-align:center;font:900 54px In;letter-spacing:10px;color:#ff7a59}
  .card{position:absolute;left:90px;right:130px;padding:36px 44px;border-radius:36px;background:rgba(15,21,48,.78);border:3px solid rgba(115,239,247,.45);
        box-shadow:0 30px 80px -30px #000;backdrop-filter:blur(10px);color:#fff;font:800 50px/1.25 In}
  .chip{display:inline-block;padding:12px 26px;border-radius:999px;font:900 34px In;letter-spacing:3px}
  .tl{position:absolute;left:110px;right:150px;top:300px;height:14px;border-radius:9px;background:rgba(255,255,255,.14)}
  .tl i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#73eff7,#ff7a59)}
  .tl b{position:absolute;top:-58px;transform:translateX(-50%);font:900 36px In;color:#fff}
  .tl s{position:absolute;top:36px;transform:translateX(-50%);font:800 28px In;color:#8e88a6;text-decoration:none}
  .bar{position:absolute;width:150px;bottom:0;border-radius:24px 24px 0 0}
  .stamp{position:absolute;left:200px;right:240px;top:640px;text-align:center;padding:26px;border:10px solid #ffc46b;border-radius:28px;
         font:900 96px In;color:#ffc46b;letter-spacing:6px;transform:rotate(-8deg)}
</style></head>
<body><div id="bg"></div><div id="grid"></div><canvas id="gl" width="1080" height="1920"></canvas><div id="ui"></div>
<script src="vendor/three.min.js"></script>
<script>
const W=1080,H=1920;
const R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0x000000,0);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,W/H,0.1,100);
scene.add(new THREE.AmbientLight(0x8a7cff,0.55));
const key=new THREE.DirectionalLight(0xffffff,1.1);key.position.set(3,4,6);scene.add(key);
const rim=new THREE.PointLight(0xff7a59,2.2,30);rim.position.set(-4,-2,3);scene.add(rim);
const cell=new THREE.Group();scene.add(cell);
// membrane
const mGeo=new THREE.IcosahedronGeometry(2.2,5),base=mGeo.attributes.position.array.slice();
const membrane=new THREE.Mesh(mGeo,new THREE.MeshStandardMaterial({color:0xff8a66,roughness:.35,metalness:.05,transparent:true,opacity:.28,side:THREE.DoubleSide}));
const wire=new THREE.Mesh(mGeo,new THREE.MeshBasicMaterial({color:0xffc46b,wireframe:true,transparent:true,opacity:.18}));
cell.add(membrane,wire);
const nucleus=new THREE.Mesh(new THREE.SphereGeometry(.75,48,48),new THREE.MeshStandardMaterial({color:0x7b5cff,emissive:0x3a1fa8,emissiveIntensity:.6,roughness:.4}));
nucleus.position.set(.25,.15,0);cell.add(nucleus);
const mitos=[];
for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.42,6,14),new THREE.MeshStandardMaterial({color:0xffc46b,emissive:0xff7a1a,emissiveIntensity:.35,roughness:.5}));
  const a=i/7*Math.PI*2;m.position.set(Math.cos(a)*1.35,Math.sin(a*1.3)*.9,Math.sin(a)*1.1);m.rotation.set(a,a*2,a*.5);cell.add(m);mitos.push(m);}
// particles: glucose (cyan) and ketones (coral)
function pts(n,color,size){const g=new THREE.BufferGeometry(),p=new Float32Array(n*3);let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<n;i++){const a=r()*6.28,b=Math.acos(2*r()-1),d=2.6+r()*1.6;p[i*3]=d*Math.sin(b)*Math.cos(a);p[i*3+1]=d*Math.cos(b)*1.4;p[i*3+2]=d*Math.sin(b)*Math.sin(a);}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));return new THREE.Points(g,new THREE.PointsMaterial({color,size,transparent:true,opacity:1,sizeAttenuation:true}));}
const glucose=pts(260,0x73eff7,.07),ketones=pts(260,0xff7a59,.09);scene.add(glucose,ketones);

function deform(t,amp){const a=mGeo.attributes.position.array;for(let i=0;i<a.length;i+=3){const x=base[i],y=base[i+1],z=base[i+2];
  const n=1+amp*(Math.sin(x*2.1+t*1.3)*Math.cos(y*1.7+t)+.5*Math.sin(z*2.9-t*1.6));a[i]=x*n;a[i+1]=y*n*1.04;a[i+2]=z*n;}
  mGeo.attributes.position.needsUpdate=true;mGeo.computeVertexNormals();}

const lerp=(a,b,u)=>a+(b-a)*Math.max(0,Math.min(1,u)),ease=u=>{u=Math.max(0,Math.min(1,u));return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
// 3D state per visual
// [x, y, z, lookAtY]: lookAtY>0 pushes the cell down the frame so top graphics stay clear
const CAM={hook:[0,0,13,0],cell:[0,0,8.2,0],insulina:[0,0,16,4.2],glucogeno:[0,0,16,4.2],grasa:[0,0,13,3.2],autofagia:[0,0,12,2.6],desconfia:[0,0,12,2.6],aviso:[0,0,17,4.6],cta:[0,0,17,4.6]};
let D=null;window.load=d=>{D=d;return d.total;};

function captions(T){const b=D.beats.find(b=>T>=b.start-0.05&&T<=b.end+0.25);if(!b)return'';
  // chunk words: max 3 words / 16 chars
  const ch=[];let cur=[];b.words.forEach(w=>{const len=cur.map(x=>x.w).join(' ').length;if(cur.length&&(cur.length>=3||len+w.w.length>16)){ch.push(cur);cur=[];}cur.push(w);if(/[,.:;?!]$/.test(w.w)&&cur.length>=1){ch.push(cur);cur=[];}});if(cur.length)ch.push(cur);
  let c=ch.find(c=>T<c[c.length-1].e+0.02)||ch[ch.length-1];
  return `<div class="cap">${c.map(w=>`<span class="${T>=w.s&&T<w.e?'on':''}">${esc(w.w).replace(/(\d+)/g,'<span class="num" style="margin:0">$1</span>')}</span>`).join('')}</div>`;}

function timeline(h,u){const p=Math.min(h/24,1)*u;let m='';[0,4,12,16,24].forEach(x=>m+=`<s style="left:${x/24*100}%">${x}h</s>`);
  return `<div class="tl"><i style="width:${p*100}%"></i><b style="left:${p*100}%">${Math.round(h*u)}h</b>${m}</div>`;}

const VIS={
 hook(t,b){const n=Math.min(16,Math.floor(ease(t/1.4)*16));const u=ease(t/1.4);
  return `<div class="lab" style="top:420px">HORA</div><div class="big" style="top:480px">${String(n).padStart(2,'0')}</div>
   <svg style="position:absolute;left:290px;top:820px" width="500" height="40"><rect x="0" y="12" width="500" height="16" rx="8" fill="rgba(255,255,255,.15)"/><rect x="0" y="12" width="${500*u*16/24}" height="16" rx="8" fill="#ff7a59"/></svg>
   <div class="lab" style="top:880px;font-size:34px;color:#8e88a6;letter-spacing:6px">SIN COMER</div>`;},
 cell(t){return `<div class="lab" style="top:330px;font-size:40px;color:#73eff7">DENTRO DE TU CUERPO</div>`;},
 insulina(t){const u=ease(t/1.6);const hi=520,lo=150,hh=lerp(hi,lo,ease((t-.6)/1.4));
  return timeline(4,u)+`<div style="position:absolute;left:300px;top:470px;width:480px;height:560px">
    <div class="bar" style="left:40px;height:${hi}px;background:rgba(255,255,255,.12)"></div>
    <div class="bar" style="left:290px;height:${hh}px;background:linear-gradient(#73eff7,#3b5dc9)"></div></div>
    <div class="lab" style="top:1050px;font-size:36px;color:#73eff7;letter-spacing:6px">INSULINA ↓</div>`;},
 glucogeno(t){const u=ease(t/1.2),lvl=lerp(.9,.3,ease((t-.5)/1.8));
  return timeline(12,u)+`<div style="position:absolute;left:380px;top:430px;width:320px;height:560px;border:8px solid #fff;border-radius:40px;overflow:hidden">
    <div style="position:absolute;left:0;right:0;bottom:0;height:${lvl*100}%;background:linear-gradient(#ffc46b,#ff7a59)"></div></div>
    <div style="position:absolute;left:500px;top:404px;width:80px;height:30px;background:#fff;border-radius:8px"></div>
    <div class="lab" style="top:1020px;font-size:34px;color:#ffc46b;letter-spacing:5px">GLUCÓGENO DEL HÍGADO</div>`;},
 grasa(t){const u=ease(t/1.0);return timeline(16,u)+`<div class="lab" style="top:470px;font-size:58px;color:#ffc46b;opacity:${ease((t-.5)/.6)}">+ GRASA</div>
   <div class="lab" style="top:560px;font-size:58px;color:#ff7a59;opacity:${ease((t-1.6)/.6)}">CETONAS ↑</div>`;},
 autofagia(t){return `<div class="big" style="top:330px;font-size:260px;color:#ffc46b">?</div>`+(t>1.3?`<div class="stamp" style="opacity:${ease((t-1.3)/.25)};transform:rotate(-8deg) scale(${lerp(1.6,1,ease((t-1.3)/.25))})">ZONA GRIS</div>`:'');},
 desconfia(t){return `<div class="card" style="top:480px;text-align:center;font-size:64px"><span style="text-decoration:line-through;text-decoration-thickness:8px;text-decoration-color:#ff6b57;opacity:.8">"16 h = autofagia"</span></div>`;},
 aviso(t){const it=['Diabetes','Medicamentos','Embarazo'];return `<div class="card" style="top:330px;border-color:#ffc46b"><div class="chip" style="background:#ffc46b;color:#0b1022;margin-bottom:24px">⚠ ANTES DE AYUNAR</div>`+
   it.map((x,i)=>`<div style="opacity:${ease((t-.3-i*.35)/.3)};margin:10px 0">• ${x}</div>`).join('')+`<div style="margin-top:20px;color:#73eff7;opacity:${ease((t-1.5)/.4)}">→ Habla con tu médico</div></div>`;},
 cta(t){return `<div class="card" style="top:360px;text-align:center;border-color:#ff7a59"><div style="font:900 44px In;color:#ffc46b;letter-spacing:4px">CALCULA TU VENTANA</div>
   <div style="margin:26px auto 0;display:inline-block;padding:26px 50px;border-radius:999px;background:#ff7a59;font:900 50px In">Link en el perfil ↗</div></div>
   <div class="lab" style="top:820px;font-size:40px;color:#fff;opacity:${ease((t-1)/.4)}">PRÓXIMO: <span style="color:#ff7a59">HORA 24</span></div>`;}
};

window.renderAt=T=>{let i=D.beats.findIndex((b,k)=>T>=b.start-0.25&&(k===D.beats.length-1||T<D.beats[k+1].start-0.25));if(i<0)i=0;
  const b=D.beats[i],t=T-(b.start-0.25),vis=b.vis;
  // camera blend between previous and current visual
  const prev=i>0?CAM[D.beats[i-1].vis]||CAM.cell:CAM[vis]||CAM.cell,cur=CAM[vis]||CAM.cell,u=ease(t/0.8);
  cam.position.set(lerp(prev[0],cur[0],u),lerp(prev[3],cur[3],u),lerp(prev[2],cur[2],u));cam.lookAt(0,lerp(prev[3],cur[3],u),0);
  cell.rotation.y=T*0.35;cell.rotation.x=Math.sin(T*.4)*.25;deform(T,.06);
  mitos.forEach((m,k)=>{m.rotation.z=T*.8+k;});
  const keto=['grasa','autofagia','desconfia'].includes(vis)?ease(t/1.5):(['aviso','cta'].includes(vis)?1:0);
  glucose.material.opacity=1-keto;ketones.material.opacity=keto;glucose.rotation.y=-T*.15;ketones.rotation.y=T*.2;
  const grey=['autofagia','desconfia'].includes(vis);membrane.material.color.set(grey?0x9a9ab8:0xff8a66);
  R.render(scene,cam);
  let h=`<div class="handle">@LADOSISDECIENCIA</div>`+(VIS[vis]?VIS[vis](t,b):'')+captions(T);
  document.getElementById('ui').innerHTML=h;};
</script></body></html>
