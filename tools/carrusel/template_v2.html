<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Fr; src: url(fonts/Fraunces.ttf); font-weight: 100 900; }
  @font-face { font-family: Fr; src: url(fonts/Fraunces-Italic.ttf); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: Is; src: url(fonts/InstrumentSerif-Italic.ttf); font-style: italic; }
  @font-face { font-family: In; src: url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf); font-weight: 500; }
  @font-face { font-family: In; src: url(file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf); font-weight: 600; }
  @font-face { font-family: In; src: url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf); font-weight: 700; }
  @font-face { font-family: In; src: url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf); font-weight: 800; }

  /* ---------- themes ---------- */
  :root{ /* claro (default) */
    --paper:#f4ede2; --paper2:#eadfcd; --ink:#1d1a16; --ink2:#4a433a; --muted:#8a7f70;
    --accent:#e0533a; --accent2:#f2a65a; --si:#2f7d5b; --no:#d2402b; --gris:#c58a1c;
    --card:#fffaf2; --cardline:rgba(29,26,22,.10); --blobA:#f7b48a; --blobB:#b9d3c2; --motif:#1d1a16;
  }
  body.noche{
    --paper:#0f1424; --paper2:#1a1f38; --ink:#f6efe4; --ink2:#c9c2d6; --muted:#8e88a6;
    --accent:#ff7a59; --accent2:#ffc46b; --si:#5fd39b; --no:#ff6b57; --gris:#ffc46b;
    --card:rgba(255,255,255,.06); --cardline:rgba(255,255,255,.14); --blobA:#6a3df0; --blobB:#ff7a59; --motif:#f6efe4;
  }
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper);}
  #stage{position:absolute;inset:0;overflow:hidden;background:var(--paper);}
  .blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
  body.noche .blob{opacity:.42}
  .grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:multiply;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  body.noche .grain{mix-blend-mode:screen;opacity:.10}
  svg.motif{position:absolute;inset:0;}

  /* ---------- chrome ---------- */
  .bars{position:absolute;top:112px;left:90px;right:90px;display:flex;gap:10px}
  .bars i{flex:1;height:7px;border-radius:9px;background:var(--ink);opacity:.14}
  .bars i.on{opacity:.9;background:var(--accent)}
  .top{position:absolute;top:150px;left:90px;right:90px;display:flex;justify-content:space-between;align-items:center;
    font:700 26px In,sans-serif;letter-spacing:5px;text-transform:uppercase;color:var(--ink)}
  .top .dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-right:14px;vertical-align:1px}
  .top .serie{font:italic 40px Is,serif;letter-spacing:0;text-transform:none;color:var(--ink2)}
  .foot{position:absolute;bottom:380px;left:90px;right:90px;display:flex;justify-content:space-between;
    font:600 28px In,sans-serif;color:var(--muted);letter-spacing:1px}

  .acc{font-family:Fr;font-style:italic;font-weight:500;color:var(--accent)}
  b{font-weight:800;color:var(--ink)}

  /* ---------- cover ---------- */
  .kicker{position:absolute;left:90px;top:330px;padding:14px 28px;border-radius:999px;border:3px solid var(--ink);
    font:700 30px In,sans-serif;letter-spacing:4px;text-transform:uppercase;color:var(--ink)}
  .c-title{position:absolute;left:84px;right:110px;top:440px;font:600 146px/1.0 Fr,serif;letter-spacing:-2.5px;color:var(--ink);
    font-variation-settings:"opsz" 144,"SOFT" 50,"WONK" 0}
  .c-title .acc{font-weight:400;letter-spacing:-1.5px}
  .c-sub{position:absolute;left:90px;right:180px;font:500 50px/1.3 In,sans-serif;color:var(--ink2)}
  .swipe{position:absolute;right:90px;bottom:450px;display:flex;align-items:center;gap:22px;
    font:700 32px In,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--ink)}
  .swipe span{display:inline-flex;width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;
    align-items:center;justify-content:center;font:700 44px In,sans-serif;letter-spacing:0}

  /* ---------- point ---------- */
  .num{position:absolute;left:84px;top:270px;font:300 230px/1 Fr,serif;letter-spacing:-8px;color:transparent;
    -webkit-text-stroke:3px var(--ink);opacity:.22;font-variation-settings:"opsz" 144}
  .pill{position:absolute;left:90px;top:300px;display:inline-flex;align-items:center;gap:16px;padding:16px 30px 16px 18px;border-radius:999px;
    font:800 30px In,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#fff}
  .pill .ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;font:800 30px In,sans-serif;letter-spacing:0}
  .v-si{background:var(--si)} .v-no{background:var(--no)} .v-gris{background:var(--gris)}
  .p-title{position:absolute;left:90px;right:150px;top:410px;font:600 108px/1.04 Fr,serif;letter-spacing:-1.5px;color:var(--ink);
    font-variation-settings:"opsz" 144,"SOFT" 50}
  .stat{position:absolute;left:90px;right:150px;display:flex;align-items:baseline;gap:22px;padding:34px 44px;border-radius:40px;
    background:var(--card);border:2px solid var(--cardline);box-shadow:0 24px 60px -30px rgba(60,30,10,.35)}
  body.noche .stat{backdrop-filter:blur(20px)}
  .stat .v{font:600 170px/0.9 Fr,serif;letter-spacing:-6px;color:var(--accent);font-variation-settings:"opsz" 144}
  .stat .u{font:600 44px/1.15 In,sans-serif;color:var(--ink2)}
  .p-body{position:absolute;left:90px;right:150px;font:500 53px/1.42 In,sans-serif;color:var(--ink2)}
  .p-note{position:absolute;left:90px;right:150px;padding:30px 38px;border-radius:28px;
    background:var(--ink);color:var(--paper);font:500 38px/1.35 In,sans-serif}
  .p-note b{color:var(--accent2)} body.noche .p-note b{color:#c2381f}

  /* ---------- cta ---------- */
  .cta-card{position:absolute;left:70px;right:70px;top:330px;bottom:450px;border-radius:56px;background:var(--ink);overflow:hidden}
  body.noche .cta-card{background:#f6efe4}
  .cta-title{position:absolute;left:150px;right:150px;top:470px;font:600 120px/1.02 Fr,serif;letter-spacing:-2px;color:var(--paper);font-variation-settings:"opsz" 144,"SOFT" 50}
  body.noche .cta-title{color:#0f1424}
  .cta-title .acc{color:var(--accent2)} body.noche .cta-title .acc{color:var(--accent)}
  .cta-body{position:absolute;left:150px;right:170px;font:500 48px/1.4 In,sans-serif;color:var(--paper);opacity:.85}
  body.noche .cta-body{color:#0f1424}
  .cta-btn{position:absolute;left:150px;right:150px;bottom:610px;padding:40px 20px;border-radius:999px;text-align:center;
    background:var(--accent);font:800 50px In,sans-serif;color:#fff;letter-spacing:.5px}
  .cta-small{position:absolute;left:150px;right:150px;bottom:520px;text-align:center;font:italic 40px Is,serif;color:var(--paper);opacity:.75}
  body.noche .cta-small{color:#0f1424}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920;
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[(.+?)\]\]/g,'<span class="acc">$1</span>').replace(/\{\{(.+?)\}\}/g,'<span class="acc">$1</span>');

// ---------- series motifs (thin-line scientific illustrations) ----------
function serieKey(s){s=(s||'').toLowerCase();
  if(s.includes('ayuno'))return'ayuno'; if(s.includes('sueño')||s.includes('sueno'))return'sueno';
  if(s.includes('intestino'))return'intestino'; if(s.includes('ejercicio')||s.includes('músculo'))return'ejercicio'; return'hormonas';}
function motif(key,cx,cy,sc,op,frac){
  const c='var(--motif)', a='var(--accent)'; let g='';
  const L=(d,w=2.5,col=c,o=1)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"/>`;
  if(key==='ayuno'){ // 24h dial
    const R=330*sc; g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${c}" stroke-width="2.5"/>`;
    g+=`<circle cx="${cx}" cy="${cy}" r="${R*.72}" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="4 14"/>`;
    for(let h=0;h<96;h++){const ang=h/96*2*Math.PI-Math.PI/2, big=h%4===0, r1=R-(big?(h%24===0?46:26):12)*sc;
      g+=L(`M${cx+R*Math.cos(ang)} ${cy+R*Math.sin(ang)} L${cx+r1*Math.cos(ang)} ${cy+r1*Math.sin(ang)}`,big?3:1.5);}
    [0,6,12,18].forEach(h=>{const ang=h/24*2*Math.PI-Math.PI/2, r=R-90*sc;
      g+=`<text x="${cx+r*Math.cos(ang)}" y="${cy+r*Math.sin(ang)+16*sc}" text-anchor="middle" font-family="Fr" font-size="${46*sc}" fill="${c}">${h}</text>`;});
    const f=frac==null?16/24:frac, Ra=R+34*sc, e=-Math.PI/2+f*2*Math.PI;
    g+=`<path d="M${cx} ${cy-Ra} A${Ra} ${Ra} 0 ${f>.5?1:0} 1 ${cx+Ra*Math.cos(e)} ${cy+Ra*Math.sin(e)}" fill="none" stroke="${a}" stroke-width="${14*sc}" stroke-linecap="round"/>`;
    g+=`<circle cx="${cx+Ra*Math.cos(e)}" cy="${cy+Ra*Math.sin(e)}" r="${20*sc}" fill="${a}"/>`;
    g+=L(`M${cx} ${cy} L${cx+R*.55*Math.cos(e)} ${cy+R*.55*Math.sin(e)}`,6*sc,a);
    g+=`<circle cx="${cx}" cy="${cy}" r="${12*sc}" fill="${c}"/>`;
  } else if(key==='sueno'){ // hypnogram + moon
    const w=720*sc,h=320*sc,x0=cx-w/2+40*sc,y0=cy-h/2, lv=['Despierto','REM','N1','N2','N3'];
    const st=[0,2,3,4,4,3,2,1,2,3,4,3,2,1,2,3,2,1,1,2,1,0];
    lv.forEach((t,k)=>{const y=y0+k*h/4;g+=L(`M${x0} ${y} L${x0+w} ${y}`,1.2,c,.35);
      g+=`<text x="${x0-18*sc}" y="${y+9*sc}" text-anchor="end" font-family="In" font-weight="600" font-size="${24*sc}" fill="${c}" opacity=".7">${t}</text>`;});
    let d='',py=0;st.forEach((v,k)=>{const x=x0+k*w/(st.length-1),y=y0+v*h/4;d+=k?`L${x} ${py} L${x} ${y} `:`M${x} ${y} `;py=y;});
    g+=L(d,5*sc,a);
    const mx=cx+w*.36,my=y0-210*sc,mr=92*sc;
    g+=`<mask id="mm"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/><circle cx="${mx+44*sc}" cy="${my-30*sc}" r="${mr*.88}" fill="#000"/></mask><circle cx="${mx}" cy="${my}" r="${mr}" fill="${a}" opacity=".9" mask="url(#mm)"/>`;
    for(let k=0;k<12;k++){g+=`<circle cx="${x0+rnd()*w*.7}" cy="${y0-90*sc-rnd()*260*sc}" r="${(2+rnd()*4)*sc}" fill="${c}" opacity=".6"/>`;}
  } else if(key==='intestino'){ // flowing villi / microbiota
    for(let k=0;k<7;k++){let d='';const y=cy-260*sc+k*85*sc, ph=rnd()*6;
      for(let x=-40;x<=W+40;x+=20){const yy=y+Math.sin(x/120+ph+k*.6)*40*sc+Math.sin(x/47+ph)*10*sc; d+=(x===-40?'M':'L')+x+' '+yy+' ';}
      g+=L(d,k===3?6*sc:2,k===3?a:c,k===3?1:.8);}
    for(let k=0;k<26;k++){const x=rnd()*W,y=cy-320*sc+rnd()*640*sc,r=(10+rnd()*22)*sc,rot=rnd()*180;
      g+=`<ellipse cx="${x}" cy="${y}" rx="${r*1.7}" ry="${r}" transform="rotate(${rot} ${x} ${y})" fill="${k%5===0?a:'none'}" stroke="${c}" stroke-width="2" opacity="${k%5===0?.85:.7}"/>`;}
  } else if(key==='ejercicio'){ // pulse + bars
    const w=820*sc,x0=cx-w/2; let d=`M${x0} ${cy}`;
    for(let x=0;x<=w;x+=4){const p=(x%260)/260;let y=0;if(p>.40&&p<.44)y=-20;else if(p>.47&&p<.5)y=30;else if(p>.5&&p<.54)y=-180*(1-Math.abs(p-.52)/.02);else if(p>.54&&p<.57)y=40;else if(p>.64&&p<.74)y=-30*Math.sin((p-.64)/.1*Math.PI);d+=` L${x0+x} ${cy+y*sc}`;}
    g+=L(d,6*sc,a);
    for(let k=0;k<12;k++){const bh=(60+((k*37)%7)*40+k*14)*sc,x=x0+k*w/12;g+=`<rect x="${x}" y="${cy+330*sc-bh}" width="${w/12-18*sc}" height="${bh}" rx="${10*sc}" fill="none" stroke="${c}" stroke-width="2.5"/>`;}
    g+=L(`M${x0} ${cy+330*sc} L${x0+w} ${cy+330*sc}`,2.5);
  } else { // hormonas: molecule (hexagon chain)
    const r=78*sc, hex=(x,y)=>{let d='';for(let k=0;k<6;k++){const an=Math.PI/6+k*Math.PI/3;d+=(k?'L':'M')+(x+r*Math.cos(an))+' '+(y+r*Math.sin(an))+' ';}return d+'Z';};
    const pts=[[0,0],[1,0],[.5,1],[1.5,1],[2,0],[2.5,1],[-.5,1]];
    pts.forEach(([i,j],k)=>{const x=cx+(i-1)*r*Math.sqrt(3),y=cy+j*r*1.5-(i%1?0:0);g+=L(hex(x,y),k===3?6*sc:2.5,k===3?a:c);
      if(k%2===0)g+=`<circle cx="${x+r*Math.cos(-Math.PI/2)}" cy="${y-r}" r="${9*sc}" fill="${c}"/>`;});
    g+=L(`M${cx+1.5*r*1.732} ${cy-r} l${60*sc} ${-90*sc}`,2.5);g+=`<text x="${cx+1.5*r*1.732+70*sc}" y="${cy-r-100*sc}" font-family="Fr" font-size="${48*sc}" fill="${c}">OH</text>`;
    g+=L(`M${cx-1.5*r*1.732} ${cy+2.5*r} l${-60*sc} ${90*sc}`,2.5);g+=`<text x="${cx-1.5*r*1.732-150*sc}" y="${cy+2.5*r+150*sc}" font-family="Fr" font-size="${48*sc}" fill="${c}">CH₃</text>`;
  }
  return `<g opacity="${op}">${g}</g>`;
}

window.render=function(spec,i){
  const s=spec.slides[i], n=spec.slides.length, st=document.getElementById('stage');
  document.body.className=spec.theme==='noche'?'noche':'';
  seed=(spec.seed||7)+i*97; rnd();rnd();
  const key=serieKey(spec.serie||(spec.slides[0]||{}).serie);
  const serie=(spec.serie||'').replace(/^Serie\s+/i,'');
  // background blobs
  const bx=[[820,420,180,1500],[140,300,900,1600],[900,1500,120,500],[200,1450,860,380]][i%4];
  let html=`<div class="blob" style="width:760px;height:760px;left:${bx[0]-380}px;top:${bx[1]-380}px;background:var(--blobA)"></div>
            <div class="blob" style="width:680px;height:680px;left:${bx[2]-340}px;top:${bx[3]-340}px;background:var(--blobB)"></div>`;
  let svg='';
  if(s.type==='cover') svg='';
  else if(s.type==='point') svg=motif(key,[860,240,840,260][i%4],1540,.82,.16,s.ring);
  else svg=motif(key,540,1500,.9,.10,s.ring);
  html+=`<svg class="motif" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${svg}</svg><div class="grain"></div>`;
  html+=`<div class="bars">${Array.from({length:n},(_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>
         <div class="top"><span><span class="dot"></span>La Dosis de Ciencia</span><span class="serie">${esc(serie)}</span></div>`;
  if(s.type==='cover'){
    html+=`<div class="kicker">${esc(s.kicker||'Serie '+serie)}</div>
      <div class="c-title" id="ct">${md(s.title)}</div>
      <div class="c-sub" id="cs">${md(s.subtitle||'')}</div>
      <div class="swipe"><span>→</span>Desliza</div>`;
  } else if(s.type==='point'){
    const v={no:['v-no','✕'],si:['v-si','✓'],gris:['v-gris','≈']}[s.verdict]||['v-gris','≈'];
    html+=
      (s.badge?`<div class="pill ${v[0]}"><span class="ic">${v[1]}</span>${esc(s.badge)}</div>`:'')+
      `<div class="p-title" id="pt">${md(s.title)}</div>`+
      (s.big?`<div class="stat" id="pb"><span class="v">${esc(s.big)}</span><span class="u">${esc(s.bigUnit||'')}</span></div>`:'')+
      `<div class="p-body" id="pbody">${md(s.body||'')}</div>`+
      (s.note?`<div class="p-note" id="pn">${md(s.note)}</div>`:'');
  } else if(s.type==='cta'){
    html+=`<div class="cta-card"></div>
      <div class="cta-title" id="ctt">${md(s.title)}</div>
      <div class="cta-body" id="ctb">${md(s.body||'')}</div>
      <div class="cta-btn">${esc(s.button||'Link en el perfil')} ↗</div>
      <div class="cta-small">${esc(s.small||'Guárdalo para tu próximo ayuno')}</div>`;
  }
  html+=`<div class="foot"><span>@ladosisdeciencia</span><span>${i+1} / ${n}</span></div>`;
  st.innerHTML=html;
  const $=id=>document.getElementById(id);
  const place=(el,after,gap)=>{if(el&&after)el.style.top=(after.offsetTop+after.offsetHeight+gap)+'px';};
  if(s.type==='cover'){ place($('cs'),$('ct'),56);
    const top=$('cs').offsetTop+$('cs').offsetHeight+70, bot=1480, avail=bot-top;
    const span={ayuno:800,sueno:680,intestino:700,ejercicio:720,hormonas:640}[key];
    let sc=Math.max(.5,Math.min(1.15,avail/span));
    let cy=top+avail/2; if(key==='sueno'){ sc=Math.max(.45,Math.min(1.1,(1380-top)/640)); cy=top+(310+160)*sc+10; } if(key==='hormonas') cy=top+avail/2-120*sc;
    document.querySelector('svg.motif').innerHTML=motif(key,key==='ayuno'?470:key==='sueno'?400:500,cy,sc,.92,s.ring); }
  if(s.type==='point'){ if($('pb')){place($('pb'),$('pt'),48);place($('pbody'),$('pb'),48);} else place($('pbody'),$('pt'),56); place($('pn'),$('pbody'),48); }
  if(s.type==='cta') place($('ctb'),$('ctt'),50);
};
</script></body></html>
